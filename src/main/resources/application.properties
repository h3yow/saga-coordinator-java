# Saga 协调器配置
saga.store-dir=build/saga-store
# 单步执行超时（毫秒）；0 表示不限制
saga.step-timeout-millis=2000
# 事务级超时：超过该时长无进展即判定超时（毫秒）
saga.transaction-timeout-millis=30000
# 补偿最大重试次数
saga.compensation-max-retries=3
# 同时推进中的事务数量上限；0 表示不限制
saga.max-concurrent-transactions=50
# 超出上限时的策略：QUEUE（排队等待）或 REJECT（快速拒绝）
saga.capacity-policy=QUEUE
# QUEUE 策略下排队等待许可的最长毫秒数，超时拒绝；0 表示一直等
saga.capacity-acquire-timeout-millis=10000
# 启动恢复与超时巡检开关
saga.recovery.enabled=true
saga.recovery.sweep-interval-millis=5000
